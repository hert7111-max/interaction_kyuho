<!doctype html><html><head><meta charset="UTF-8"><title>particle · rubber QA</title><style>body{margin:0;background:#000;color:#fff;font:12px monospace}canvas{position:absolute;inset:0;width:100%;height:100%}video{position:absolute;width:1px;height:1px;opacity:0}pre{position:fixed;z-index:3;left:12px;top:12px;max-width:80%;padding:15px;background:#000c;white-space:pre-wrap;line-height:1.8}</style></head><body><video muted playsinline></video><canvas></canvas><pre>particle · pinch / stretch / slow recovery QA</pre><script type="module">
import {RubberSurface,PinchInput} from '/src/particle-engine.ts'
import {ParticleRenderer} from '/src/particle-renderer.ts'
import {ParticleTracking} from '/src/particle-tracking.ts'
const log=t=>document.querySelector('pre').textContent+='\n'+t,video=document.querySelector('video'),canvas=document.querySelector('canvas')
addEventListener('error',e=>log('FAIL '+e.message))
try{
 const image=new Image();image.crossOrigin='anonymous';image.src='https://storage.googleapis.com/mediapipe-tasks/hand_landmarker/woman_hands.jpg';await image.decode()
 const source=document.createElement('canvas');source.width=image.width;source.height=image.height;const ctx=source.getContext('2d');ctx.drawImage(image,0,0);video.srcObject=source.captureStream(30);await video.play()
 const engine=new RubberSurface(),pinches=new PinchInput(engine);engine.aspect=innerWidth/innerHeight
 const renderer=new ParticleRenderer(canvas,video,engine);renderer.ready=true
 const mode=new URLSearchParams(location.search).get('backend'),tracker=new ParticleTracking({worker:mode!=='main',bitmap:mode!=='pixels'})
 let ready=false,initialized=false,busy=false,lastCapture=0,last=0,start=0,base=null,checked=false,released=false,slow=false,initialPull=0
 const origin={x:.47,y:.56},target={x:.69,y:.59}
 function hand(point,gap=.01){const h=Array.from({length:21},()=>({...point}));h[0]={x:point.x,y:point.y-.12};h[9]={x:point.x,y:point.y+.04};h[5]={x:point.x-.07,y:point.y};h[17]={x:point.x+.07,y:point.y};h[4]={x:point.x-gap/2,y:point.y};h[8]={x:point.x+gap/2,y:point.y};return h}
 const read=()=>{const gl=renderer.renderer.getContext(),data=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4);gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,data);return{data,width:gl.drawingBufferWidth,height:gl.drawingBufferHeight}}
 const finish=()=>{tracker.close();video.pause();video.srcObject.getTracks().forEach(t=>t.stop())}
 tracker.onresult=data=>{busy=false;if(!ready){log((data.landmarks.length===2?'PASS':'FAIL')+' actual MediaPipe: '+data.landmarks.length+' hands');tracker.close();ready=true}}
 tracker.onerror=e=>log('FAIL '+e.message)
 function frame(now){
   ctx.drawImage(image,0,0);const dt=last?Math.min(.05,(now-last)/1000):1/60;last=now
   if(ready&&!base){renderer.render(video.videoWidth/video.videoHeight);base=read();start=now;pinches.hand('left',hand(origin),now)}
   const age=(now-start)/1000
   if(base&&!released){const t=Math.min(1,age/1.1);pinches.hand('left',hand({x:origin.x+(target.x-origin.x)*t,y:origin.y+(target.y-origin.y)*t}),now)}
   engine.update(dt);renderer.render(video.videoWidth/video.videoHeight)
   if(base&&!checked&&age>1.6){
     checked=true;const current=read();let changed=0,color=0
     for(let i=0;i<current.data.length;i+=4){if(Math.abs(current.data[i]-base.data[i])>15)changed++;if(Math.max(current.data[i],current.data[i+1],current.data[i+2])-Math.min(current.data[i],current.data[i+1],current.data[i+2])>2)color++}
     const picked=engine.sourceAt(target)
     log((Math.hypot((picked.x-origin.x)*engine.aspect,picked.y-origin.y)<.02?'PASS':'FAIL')+' grabbed pixels follow pinch: '+JSON.stringify(picked))
     log((changed>1000&&color===0?'PASS':'FAIL')+' smooth monochrome stretch: '+changed+' changed pixels, '+color+' colored pixels')
     if(new URLSearchParams(location.search).has('hold')){finish();return}
     pinches.hand('left',hand(target,.2),now);released=true;initialPull=target.x-engine.sourceAt(target).x
     log(engine.grips.size===0?'PASS opening fingers releases material':'FAIL pinch release')
   }
   if(released&&!slow&&age>3.7){slow=true;log((target.x-engine.sourceAt(target).x>initialPull*.9?'PASS':'FAIL')+' retains over 90% stretch two seconds after release')}
   if(released&&age>18.1&&engine.stage==='idle'){
     const current=read();let changed=0;for(let i=0;i<current.data.length;i+=4)if(Math.abs(current.data[i]-base.data[i])>2)changed++
     log(changed===0?'PASS exact return to original video after 16-second recovery':'FAIL recovery: '+changed+' pixels');finish();return
   }
   if(initialized&&!ready&&!busy&&now-lastCapture>tracker.budget.interval){busy=true;lastCapture=now;tracker.frame(video,now,1).catch(e=>log('FAIL '+e.message))}
   requestAnimationFrame(frame)
 }
 requestAnimationFrame(frame);await tracker.init(location.origin+'/');initialized=true;log('PASS hands-only runtime initialized')
}catch(e){log('FAIL '+e.stack)}
</script></body></html>
